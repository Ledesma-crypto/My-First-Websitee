<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: linear-gradient(180deg, #4facfe 0%, #90d5f8 50%, #e0f4ff 100%);
            min-height: 100vh;
            color: #2c3e50;
        }
        h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .button {
            display: inline-block;
            padding: 14px 30px;
            margin: 10px;
            background-color: white;
            color: #2980b9;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }
        .button:hover {
            transform: translateY(-3px);
            background-color: #f0f9ff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        .content-box {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }
        .content-box.show {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website ☁️</h1>
    
    <button class="button" onclick="showHome()">Home</button>
    <button class="button">About Me</button>
    <button class="button">Contact Me</button>

    <!-- 🏠 Home Description -->
    <div id="homeBox" class="content-box">
        <h2>🏠 Home</h2>
        <p>Welcome to my personal website!</p>
        <p>Here you can learn more about me, my hobbies, and how to get in touch. Thanks for stopping by! 😊</p>
    </div>

    <script>
        function showHome() {
            document.getElementById('homeBox').classList.add('show');
        }
    </script>

</body>
</html>
